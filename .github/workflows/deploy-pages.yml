name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin Quartz so builds stay reproducible. Bump intentionally when upgrading.
  QUARTZ_COMMIT: 74b3fc9efd0caafea3dbcd846ddf1f06855b6d2a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin to Node 22 (Quartz's .node-version). `latest` (Node 26+) breaks
      # @quartz-themes/core's install-then-require of theme packages mid-build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate vault markdown
        run: node lib/generate-markdown.ts

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_COMMIT }}
          path: quartz

      # npm blocks dependency install scripts unless allowlisted in package.json.
      # approve can't run before install (needs the tree), so write allowScripts first.
      # Fail if Quartz already ships allowScripts so we can drop this workaround.
      - name: Allow Quartz install scripts
        working-directory: quartz
        run: |
          node <<'EOF'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.allowScripts != null) {
            console.error(
              'Quartz package.json already defines allowScripts; remove this workflow step.',
            )
            process.exit(1)
          }
          pkg.allowScripts = {
            '@parcel/watcher': true,
            esbuild: true,
            sharp: true,
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          EOF

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Create Quartz site
        working-directory: quartz
        run: >
          npx quartz create
          -t ttrpg
          -d content
          -s "../vault"
          -X copy
          -l shortest
          -b abane94.github.io/atlas-summary
          -v

      - name: Install Quartz plugins
        working-directory: quartz
        run: npx quartz plugin install

      # ttrpg template needs this; installing before build avoids core's fragile
      # mid-build `npm install` + same-process require (broken on Node 26+).
      - name: Install Quartz theme package
        working-directory: quartz
        run: npm install @quartz-themes/its-theme

      - name: Copy quartz.config.yaml
        working-directory: .
        run: cp quartz.config.yaml quartz/quartz.config.yaml

      # save the tree output of the whole project
      - name: save tree.txt
        working-directory: .
        run: tree -a -I 'node_modules|.git|.DS_Store' > tree.txt
        uses: actions/upload-artifact@v4
        with:
          name: tree.txt
          path: tree.txt

      # upload quartz/quartz.config.yaml as an artifact for refrence
      - name: save config.yaml
        uses: actions/upload-artifact@v4
        with:
          name: quartz.config.yaml
          path: quartz/quartz.config.yaml

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
